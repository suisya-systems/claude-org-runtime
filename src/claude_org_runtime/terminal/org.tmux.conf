# claude-org tmux config (issue #250). Sourced by TmuxAdapter on every spawn,
# on the dedicated broker socket only (-L claude-org-broker). Re-sourcing must
# stay idempotent: no appends to array options.

# --- 1. Safety first: no default key or menu may kill or respawn an agent. ---
# kill-window on a window linked into the cockpit also destroys the agent's own
# session, so & unlinks instead. x (kill-pane) is dropped.
unbind -T prefix x
unbind -T prefix '&'
bind -T prefix '&' unlink-window
# < and > open the window / pane menus, which contain Kill and Respawn.
unbind -T prefix '<'
unbind -T prefix '>'
# s / w / f open choose-tree, whose own x / X keys kill windows and sessions.
unbind -T prefix s
unbind -T prefix w
unbind -T prefix f
# Right-click menus (status, status-left, pane) contain Kill and Respawn.
unbind -n M-MouseDown3Pane
unbind -n MouseDown3StatusLeft
unbind -n M-MouseDown3StatusLeft
unbind -n M-MouseDown3Status
bind -n MouseDown3Status select-window -t=
bind -n MouseDown3Pane select-pane -t= \; send -M

# --- 2. Usability ---
set -g mouse on
set -s escape-time 10
# The default status-right (host + date) used about half of an 80-column line.
set -g status-right ''

# --- 3. Claude Code recommended settings (code.claude.com/docs/en/terminal-config).
# tmux 3.4 has no extended-keys-format (3.5+). A fixed array index keeps the
# terminal-features entry from being appended again on every re-source.
set -g allow-passthrough on
set -g focus-events on
set -s extended-keys on
set -s terminal-features[90] 'xterm*:extkeys'

# --- 4. Prefix off C-b: Claude Code uses Ctrl+B to background tasks. ---
set -g prefix C-Space
unbind -T prefix C-b
bind -T prefix C-Space send-prefix

# --- 5. Copy: keep set-clipboard external (apps cannot write the clipboard)
# and pipe copies to the Windows clipboard on WSL.
set -s set-clipboard external
if-shell 'command -v clip.exe >/dev/null 2>&1' {
  bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel clip.exe
  bind -T copy-mode M-w send -X copy-pipe-and-cancel clip.exe
  bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel clip.exe
  bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel clip.exe
  bind -T copy-mode-vi y send -X copy-pipe-and-cancel clip.exe
}
