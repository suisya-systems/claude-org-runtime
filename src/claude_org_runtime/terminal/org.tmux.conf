# claude-org tmux config (issue #250). Sourced by TmuxAdapter on every spawn,
# on the dedicated broker socket only (-L claude-org-broker). Re-sourcing must
# stay idempotent: no appends to array options.

# --- 1. Safety first: no default key or menu may kill or respawn an agent. ---
# kill-window on a window linked into the cockpit also destroys the agent's own
# session, so & unlinks instead. x (kill-pane) is dropped.
unbind -T prefix x
unbind -T prefix '&'
bind -T prefix '&' unlink-window
# < and > open the window / pane menus, which contain Kill and Respawn.
unbind -T prefix '<'
unbind -T prefix '>'
# s / w / f open choose-tree, whose own x / X keys kill windows and sessions.
unbind -T prefix s
unbind -T prefix w
unbind -T prefix f
# Right-click menus (status, status-left, pane) contain Kill and Respawn.
unbind -n M-MouseDown3Pane
unbind -n MouseDown3StatusLeft
unbind -n M-MouseDown3StatusLeft
unbind -n M-MouseDown3Status
# MouseDown3Status is the cockpit tab menu, section 6.
bind -n MouseDown3Pane select-pane -t= \; send -M

# --- 2. Usability ---
set -g mouse on
set -s escape-time 10
# The default status-right (host + date) used about half of an 80-column line.
# Selected window's context usage (@ctx, e.g. 42%): plain below 70, yellow from
# 70, red from 90. Nothing while unknown.
set -g status-right '#{?#{@ctx},#{?#{m/r:^(9[0-9]|100)%$,#{@ctx}},#[fg=black bg=red],#{?#{m/r:^[78][0-9]%$,#{@ctx}},#[fg=black bg=yellow],}} ctx #{@ctx} #[default],}'

# --- 3. Claude Code recommended settings (code.claude.com/docs/en/terminal-config).
# tmux 3.4 has no extended-keys-format (3.5+). A fixed array index keeps the
# terminal-features entry from being appended again on every re-source.
set -g allow-passthrough on
set -g focus-events on
set -s extended-keys on
set -s terminal-features[90] 'xterm*:extkeys'

# --- 4. Prefix off C-b: Claude Code uses Ctrl+B to background tasks. ---
set -g prefix C-Space
unbind -T prefix C-b
bind -T prefix C-Space send-prefix

# --- 5. Copy: keep set-clipboard external (apps cannot write the clipboard)
# and pipe copies to the Windows clipboard on WSL.
set -s set-clipboard external
if-shell 'command -v clip.exe >/dev/null 2>&1' {
  bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel clip.exe
  bind -T copy-mode M-w send -X copy-pipe-and-cancel clip.exe
  bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel clip.exe
  bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel clip.exe
  bind -T copy-mode-vi y send -X copy-pipe-and-cancel clip.exe
}

# --- 6. Cockpit (session "org"): tabs, the waiting line, the tab menu. ---
# Tabs show the task and its state, never the window number (prefix+digit
# stops at 9). The tab also shows @ctx, the context usage. @task / @state / @ctx are window options written by the broker.
set -g status 2
set -g window-status-format ' #{?#{==:#{@state},waiting},#[fg=black bg=yellow],}#{?#{@task},#{@task},#W}#{?#{@state}, #{@state},}#{?#{@ctx}, #{@ctx},} '
set -g window-status-current-format ' #{?#{@task},#{@task},#W}#{?#{@state}, #{@state},}#{?#{@ctx}, #{@ctx},} '
set -g window-status-current-style reverse
# Line 2 lists every agent that needs the operator; each entry is a click range
# (range=window, not range=user: user ranges are 15 bytes, task names may not be ASCII).
set -g status-format[1] '#[align=left]#{?#{W:#{?#{m/r:^(waiting|needs-decision|done)$,#{@state}},1,}},#[fg=black bg=yellow fill=yellow] Needs you:#{W:#{?#{m/r:^(waiting|needs-decision|done)$,#{@state}}, #[range=window|#{window_index}]#{?#{@task},#{@task},#W} (#{@state})#[norange],}}, No agent needs you}'

# Right-click on a tab. "Interrupt (Esc)" only while working: on a permission
# prompt Esc declines the action. It re-checks @state when clicked (## survives
# the menu's own format expansion). Never an approve item, never Enter.
# Peek and Back go to the first cockpit window (home, the secretary's window).
bind -n MouseDown3Status if -F -t = '#{==:#{@state},working}' {
  display-menu -t = -x W -y W -T '#[align=centre]#{?#{@task},#{@task},#W}' \
    'Switch' s 'select-window -t #{window_id}' \
    'Peek (read-only)' p "select-window -t =org:^ ; split-window -h -d -t =org:^ '#{@org_runtime} org peek #{pane_id}'" \
    'Back to secretary' b 'select-window -t =org:^' \
    '' \
    'Interrupt (Esc)' i "if -F -t #{pane_id} '##{==:##{@state},working}' 'send-keys -t #{pane_id} Escape'"
} {
  display-menu -t = -x W -y W -T '#[align=centre]#{?#{@task},#{@task},#W}' \
    'Switch' s 'select-window -t #{window_id}' \
    'Peek (read-only)' p "select-window -t =org:^ ; split-window -h -d -t =org:^ '#{@org_runtime} org peek #{pane_id}'" \
    'Back to secretary' b 'select-window -t =org:^'
}
