name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    name: pytest (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install bubblewrap (Linux)
        # The sandbox deny-path tests assert against the real bwrap binary
        # rather than a model of it. Without this they skip, and the check
        # that matters most -- that our symlink verdict matches
        # bubblewrap's -- would never run in CI.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 blocks the unprivileged user namespaces bwrap
          # needs; without this the binary is present but cannot start.
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = "1" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / true && echo "bwrap operational" || echo "bwrap present but cannot start; those tests will skip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Run pytest
        run: python -m pytest -x -q

  # Single, stable check name for branch protection. Requiring each matrix
  # leg by name breaks whenever the matrix changes, and leaving legs out is
  # how a red-on-Windows PR auto-merged (#136). This job fails unless every
  # leg passed; `always()` keeps it from being skipped (a skipped required
  # check counts as passing) when a leg fails.
  pytest-required:
    name: pytest (all)
    needs: pytest
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every matrix leg to pass
        run: |
          echo "pytest matrix result: ${{ needs.pytest.result }}"
          test "${{ needs.pytest.result }}" = "success"
